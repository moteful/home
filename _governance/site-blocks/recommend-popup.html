<div id="rec-popup" class="rec-modal" role="dialog" aria-modal="true" aria-hidden="true" data-i18n-aria="rec_title" aria-label="推荐">
  <div class="rec-mask" data-rec-close></div>
  <div class="rec-box">
    <button class="btn btn-icon btn-secondary btn-close rec-close-icon" type="button" data-rec-close aria-label="关闭"><i data-lucide="x"></i></button>
    <div class="rec-check"><i data-lucide="check-circle"></i></div>
    <p class="rec-msg" id="recMsg" data-i18n="rec_done">操作成功</p>
    <p class="rec-sub" data-i18n="rec_sub">感谢使用 Moteful，下面这些功能你可能也用得上：</p>
    <div class="rec-cards" id="recCards">{{RECS}}</div>
    <div class="rec-tip">
      <div class="rec-tip-line">
        <svg class="lucide-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg>
        <span class="rec-tip-text" data-i18n="rec_tip_note">如果这个工具帮到了你，欢迎请作者喝杯咖啡</span>
      </div>
      <a class="btn btn-primary rec-tip-btn" href="https://www.paypal.com/ncp/payment/EMH4YJBBK5L3C" target="_blank" rel="noopener noreferrer" data-i18n="rec_tip_btn">赞助支持</a>
    </div>
    <div class="rec-actions">
      <button class="btn btn-secondary" type="button" data-rec-share data-i18n="rec_share">分享</button>
      <button class="btn btn-secondary rec-close-btn" type="button" data-rec-close data-i18n="rec_close">关闭</button>
    </div>
  </div>
</div>
